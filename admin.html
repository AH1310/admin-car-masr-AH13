.field{border:1px solid var(--border);border-radius:10px;padding:10px 12px;min-width:0;background:#fff;color:var(--ink);width:100%}textarea{min-height:95px;resize:vertical}label{display:flex;flex-direction:column;gap:4px;font-weight:800;font-size:12px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.wide{grid-column:1/-1}.hint{color:var(--muted);font-size:12px;line-height:1.9}.error{color:#b22d40}.sidebar{width:250px;position:fixed;inset:0 0 0 auto;background:var(--navy);color:#c6d2e1;padding:22px 14px;z-index:20;display:flex;flex-direction:column;gap:22px;overflow:auto}.identity{display:flex;align-items:center;gap:9px;padding:5px 7px 20px;border-bottom:1px solid #ffffff24;color:#fff}.identity img{width:54px;height:54px;border-radius:13px;object-fit:cover}.identity strong{display:block;font-family:Arial,sans-serif;font-size:18px;letter-spacing:-.8px}.identity small{font-size:10px;color:#98acc3}.navtabs{display:grid;gap:4px}.navtabs button{border:0;color:#c6d2e1;background:transparent;text-align:right;padding:11px 14px;border-radius:11px;font-size:13px;font-weight:800}.navtabs button.active,.navtabs button:hover{color:white;background:#263d5c}.navtabs .emoji{margin-left:9px}.sidebar-foot{margin-top:auto;font-size:12px}.sidebar-foot a{display:block;padding:9px;color:#fff}
.workspace{margin-right:250px;min-height:100vh}.head{background:#fff;border-bottom:1px solid var(--border);height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;gap:12px;position:sticky;top:0;z-index:10}.head h1{font-size:19px;margin:0;font-weight:900}.head small{color:var(--muted);font-size:11px}.head-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.head-actions strong{font-size:11px}.main{width:min(1180px,calc(100% - 44px));margin:27px auto}.panel{background:#fff;border:1px solid var(--border);border-radius:17px;padding:22px;box-shadow:0 6px 18px #1a34510b;margin-bottom:17px}.panel h2{font-size:18px;margin:0 0 14px}.sectionbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.sectionbar h2{margin:0}.muted{color:var(--muted)}.statgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.stat{padding:18px;border-radius:16px;background:#fff;border:1px solid var(--border)}.stat span{font-size:12px;color:#697c94}.stat strong{display:block;font-family:Arial,sans-serif;font-size:32px;font-weight:900;color:#15243b}.stat small{font-size:10px;color:#929cad}.actionbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.actionbar .field{width:auto;min-width:170px}.tablebox{overflow-x:auto}.table{width:100%;border-collapse:collapse;min-width:690px;text-align:right;font-size:12px}.table th{font-size:11px;color:#718196;padding:11px 12px;background:#f7f9fb;white-space:nowrap}.table td{border-bottom:1px solid #edf0f4;padding:11px 12px;vertical-align:middle}.table tr:last-child td{border-bottom:0}.tag{font-size:10px;font-weight:900;display:inline-block;background:#fff0f2;color:#cf253d;border-radius:8px;padding:5px 8px;white-space:nowrap}.tag.active{background:#e6f7f0;color:#147b55}.tag.pending{background:#fff5d9;color:#956900}.tag.hidden{background:#edf0f4;color:#6c7d92}.rowactions{display:flex;gap:5px;flex-wrap:wrap}.preview{width:73px;height:52px;border-radius:9px;object-fit:cover;background:#e8edf3;display:block}.pager{display:flex;justify-content:center;gap:9px;align-items:center;margin-top:15px}.empty{padding:38px 18px;text-align:center;color:var(--muted)}.pill{background:#ffedf0;color:#d21a32;padding:3px 9px;border-radius:10px;font-size:11px;font-weight:800}.danger-note{border:1px solid #f5ccd3;background:#fff4f6;color:#b42d41;padding:12px;border-radius:10px;font-size:12px;line-height:1.9}.two{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}.login-screen{position:fixed;inset:0;display:grid;place-items:center;z-index:60;padding:16px;background:linear-gradient(130deg,#071324,#162b45 75%,#651f32)}.login-box{max-width:430px;width:100%;padding:32px;border-radius:22px;background:#fff;box-shadow:var(--shadow)}.login-box .logo{height:70px;width:70px;border-radius:18px;object-fit:cover}.login-box h2{margin:10px 0 5px}.login-box label{margin-bottom:12px}.modal-backdrop{position:fixed;inset:0;background:#05101ad2;z-index:80;display:grid;place-items:center;padding:15px}.modal{width:min(680px,100%);max-height:92vh;overflow-y:auto;background:#fff;border-radius:20px;padding:24px}.modalbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.modalbar h2{margin:0}.notice{position:fixed;bottom:19px;left:19px;z-index:100;max-width:450px;border-radius:13px;background:#182940;color:#fff;padding:13px 19px;box-shadow:var(--shadow);font-size:12px;line-height:1.8}
@media(max-width:1050px){.statgrid{grid-template-columns:repeat(2,1fr)}.sidebar{width:212px}.workspace{margin-right:212px}.two{grid-template-columns:1fr}}
@media(max-width:730px){.sidebar{position:static;width:100%;padding:13px;gap:10px}.identity{padding:0 0 8px;border:0}.identity img{width:39px;height:39px}.navtabs{display:flex;overflow:auto;scrollbar-width:thin;white-space:nowrap;gap:5px}.navtabs button{flex-shrink:0;padding:8px 10px;font-size:11px}.sidebar-foot{display:none}.workspace{margin:0}.head{height:auto;min-height:70px;padding:12px 16px}.head h1{font-size:15px}.head-actions strong{display:none}.head-actions .btn{font-size:10px}.main{width:calc(100% - 24px);margin:15px auto}.panel{padding:14px;border-radius:13px}.statgrid{gap:9px}.stat{padding:13px}.stat strong{font-size:25px}.form-grid{grid-template-columns:1fr}.actionbar .field{width:100%}.actionbar{align-items:stretch}.modal{padding:16px}}

<div id="loginScreen" class="login-screen">
 <div class="login-box"><img class="logo" src="./logo.png" alt="شعار كار مصر"><h2>إدارة كار مصر</h2><p class="hint">الدخول مخصص للمسؤولين المعتمدين في قاعدة البيانات فقط.</p>
  <form id="loginForm"><label>البريد الإلكتروني<input id="loginEmail" class="field" type="email" autocomplete="email" required></label><label>كلمة المرور<input id="loginPass" class="field" type="password" autocomplete="current-password" required></label><button type="submit" class="btn" style="width:100%">تسجيل الدخول</button></form>
  <p id="loginMessage" class="hint"></p><p class="hint">الدخول مخصص لمدير الموقع المعتمد فقط.</p><a class="hint" href="./index.html">← العودة للموقع</a>
 </div>

  <nav class="navtabs" id="tabs">
   <button data-tab="home" class="active"><span class="emoji">◈</span>نظرة عامة</button>

   <button data-tab="users"><span class="emoji">👥</span>المستخدمون</button>
   <button data-tab="catalog"><span class="emoji">▦</span>الأقسام والماركات</button>

<div class="workspace"><header class="head"><div><h1 id="pageTitle">لوحة الإدارة</h1><small>كار مصر · إدارة المحتوى والحسابات</small></div><div class="head-actions"><strong id="adminName"></strong><button class="btn green small" data-tab="new">＋ مركبة جديدة</button><a class="btn gray small" href="./index.html">عرض الموقع ↗</a><button class="btn warn small" id="logout">خروج</button></div></header>
<main class="main" id="content"><div class="panel">جارٍ التحميل...</div></main></div>
</div>
<div id="modalBackdrop" class="modal-backdrop hidden"><div class="modal"><div class="modalbar"><h2 id="modalTitle"></h2><button class="btn gray" id="modalClose">✕</button></div><div id="modalContent"></div></div></div>
<div id="notice" class="notice hidden" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{'use strict';
const SUPABASE_URL='https://pnhwhlgqetgkwknimdkn.supabase.co';
const SUPABASE_KEY='sb_publishable_ZD3SOzq30LCylXmpsk4Mzw_XIt9naAz';
if(!window.supabase){document.getElementById('loginMessage').textContent='تعذر تحميل Supabase. تحقق من اتصال الإنترنت.';return;}
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>Number(v||0).toLocaleString('ar-EG')+' ج.م';
const dt=v=>v?new Date(v).toLocaleDateString('ar-EG'):'—';
const TAG={pending:'قيد المراجعة',active:'منشور',rejected:'مرفوض',sold:'تم البيع',draft:'مسودة',hidden:'مخفي',open:'مفتوح',resolved:'تم الحل',reviewing:'تحت المراجعة'};
let user=null,active='home',page=0,lastCount=0,query='',timer=0,brands=[],currentStatus='pending';
function notice(t){$('notice').textContent=t;$('notice').classList.remove('hidden');clearTimeout(timer);timer=setTimeout(()=>$('notice').classList.add('hidden'),4300);}
function error(e){console.error(e);notice('حدث خطأ: '+(e?.message||'يرجى المحاولة من جديد'));}
function modal(title,body){$('modalTitle').textContent=title;$('modalContent').innerHTML=body;$('modalBackdrop').classList.remove('hidden');}
function dismiss(){$('modalBackdrop').classList.add('hidden');$('modalContent').innerHTML='';}
$('modalClose').onclick=dismiss;$('modalBackdrop').onclick=e=>{if(e.target===$('modalBackdrop'))dismiss();};
async function authCheck(){
 const {data:{user:current},error:sessionErr}=await db.auth.getUser();
 if(sessionErr||!current){user=null;if(sessionErr)$('loginMessage').textContent='مشكلة في الجلسة: '+sessionErr.message;return showLogin();}
 const {data,error:adminErr}=await db.from('cm_admins').select('user_id').eq('user_id',current.id).maybeSingle();
 if(adminErr||!data){user=null;$('loginMessage').textContent=adminErr?'فشل فحص صلاحيات الإدارة: '+adminErr.message:'الحساب موجود، لكن ليس ضمن جدول cm_admins. فعّل حساب الأدمن من SQL Editor.';return showLogin();}
 user=current;$('loginScreen').classList.add('hidden');$('app').classList.remove('hidden');$('adminName').textContent=current.email||'مدير الموقع';await openTab(active);
}
function showLogin(){$('loginScreen').classList.remove('hidden');$('app').classList.add('hidden');}
$('loginForm').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;$('loginMessage').textContent='جارٍ التحقق من الحساب...';try{const {error}=await db.auth.signInWithPassword({email:$('loginEmail').value.trim(),password:$('loginPass').value});if(error)throw error;$('loginMessage').textContent='';await authCheck();}catch(ex){$('loginMessage').textContent=ex.message||'تعذر تسجيل الدخول';}finally{btn.disabled=false;}};
$('logout').onclick=async()=>{await db.auth.signOut();user=null;showLogin();};
const b=(label,attrs='',cls='gray')=>`<button class="btn small ${cls}" ${attrs}>${label}</button>`;
const badge=s=>`<span class="tag ${safe(s)}">${safe(TAG[s]||s||'—')}</span>`;
const blank=msg=>`<div class="empty">${safe(msg)}</div>`;
function toolbar(title,html=''){return `<div class="sectionbar"><h2>${safe(title)}</h2><div class="actionbar">${html}</div></div>`;}
function table(cols,rows){return `<div class="tablebox"><table class="table"><thead><tr>${cols.map(v=>`<th>${safe(v)}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${cols.length}">${blank('لا توجد بيانات')}</td></tr>`}</tbody></table></div>`;}
function pagination(){return `<div class="pager">${b('السابق','data-page="prev"'+(page===0?' disabled':''))}<span class="hint">صفحة ${page+1}${lastCount<20?' · آخر صفحة':''}</span>${b('التالي','data-page="next"'+(lastCount<20?' disabled':''))}</div>`;}
function valForm(form){return Object.fromEntries(new FormData(form).entries());}
async function getCount(table,filter){let q=db.from(table).select('*',{head:true,count:'exact'});if(filter)q=q.eq(filter[0],filter[1]);const {count,error:e}=await q;if(e)throw e;return count||0;}
async function home(){const [all,pending,activeAds,users,reports,offers]=await Promise.all([getCount('cm_listings'),getCount('cm_listings',['status','pending']),getCount('cm_listings',['status','active']),getCount('cm_profiles'),getCount('cm_reports',['status','open']),getCount('cm_offers')]);
 const cards=[['كل المركبات',all,'تشمل جميع الحالات'],['بانتظار المراجعة',pending,'تحتاج قرارًا منك'],['المركبات المنشورة',activeAds,'ظاهرة في الموقع'],['الحسابات',users,'بائعون ومشترون'],['البلاغات المفتوحة',reports,'مراجعة الشكاوى'],['عروض الأسعار',offers,'عروض قدمها المستخدمون']];
 $('content').innerHTML=`<div class="panel"><h2>مرحبًا بك في إدارة كار مصر 👋</h2><p class="hint">الأرقام مباشرة من قاعدة البيانات. تأكد من مراجعة المركبات والصور قبل النشر.</p></div><div class="statgrid">${cards.map(c=>`<div class="stat"><span>${c[0]}</span><strong>${c[1].toLocaleString('ar-EG')}</strong><small>${c[2]}</small></div>`).join('')}</div><div class="panel" style="margin-top:18px">${toolbar('إجراءات سريعة')}<div class="actionbar">${b('مركبة جديدة','data-tab="new"','green')}${b('مراجعة المركبات','data-tab="listings"','gray')}${b('مراجعة البلاغات','data-tab="reports"','gray')}${b('إعدادات الموقع','data-tab="settings"','gray')}</div></div>`;
}

// AD ADMIN CREATE AND EDIT LISTINGS
let acats=[],abrands=[],agovs=[];
async function adLookups(){const [c,b,g]=await Promise.all([db.from('cm_categories').select('id,name_ar').order('sort_order'),db.from('cm_brands').select('id,name_ar').order('name_ar'),db.from('cm_governorates').select('id,name_ar').order('name_ar')]);for(const x of [c,b,g])if(x.error)throw x.error;acats=c.data||[];abrands=b.data||[];agovs=g.data||[];}
function options(data,sel){return '<option value="">اختر...</option>'+data.map(x=>`<option value="${x.id}" ${String(x.id)===String(sel)?'selected':''}>${safe(x.name_ar)}</option>`).join('');}
function adForm(v={}){return `<form id="adForm" class="form-grid">
<label class="wide">عنوان المركبة<input class="field" name="title" minlength="5" maxlength="160" required value="${safe(v.title||'')}" placeholder="هيونداي إلنترا 2020 بحالة ممتازة"></label>
<label>الفئة<select class="field" name="category_id" required>${options(acats,v.category_id)}</select></label>
<label>الماركة<select class="field" name="brand_id" id="adBrand">${options(abrands,v.brand_id)}</select></label>
<label>الموديل<select class="field" name="model_id" id="adModel"><option value="">آخر أو غير محدد</option></select></label>
<label>اسم الموديل يدويًا<input class="field" name="model_custom" value="${safe(v.model_custom||'')}"></label>
<label>السعر بالجنيه<input class="field" name="price" type="number" min="0" step="1" required value="${v.price??''}"></label>
<label>سنة الصنع<input class="field" name="manufacture_year" type="number" min="1900" max="2100" value="${v.manufacture_year||''}"></label>
<label>الكيلومترات<input class="field" name="mileage_km" type="number" min="0" value="${v.mileage_km??''}"></label>
<label>اللون<input class="field" name="color" value="${safe(v.color||'')}"></label>
<label>الحالة<select class="field" name="vehicle_condition"><option value="used" ${v.vehicle_condition!=='new'?'selected':''}>مستعمل</option><option value="new" ${v.vehicle_condition==='new'?'selected':''}>زيرو</option></select></label>
<label>الوقود<select class="field" name="fuel_type"><option value="">غير محدد</option>${[['petrol','بنزين'],['diesel','سولار'],['electric','كهرباء'],['hybrid','هايبرد'],['gas','غاز'],['not_applicable','لا ينطبق']].map(([key,label])=>`<option value="${key}" ${v.fuel_type===key?'selected':''}>${label}</option>`).join('')}</select></label>
<label>الفتيس<select class="field" name="transmission"><option value="">غير محدد</option>${[['automatic','أوتوماتيك'],['manual','مانيوال'],['cvt','CVT'],['semi_automatic','نصف أوتوماتيك']].map(([key,label])=>`<option value="${key}" ${v.transmission===key?'selected':''}>${label}</option>`).join('')}</select></label>
<label>المحافظة<select class="field" name="governorate_id" required>${options(agovs,v.governorate_id)}</select></label>
<label>المدينة / المركز<input class="field" name="city" required value="${safe(v.city||'')}"></label>
<label>رقم الموبايل الظاهر للناس<input class="field" name="contact_phone" type="tel" value="${safe(v.contact_phone||'')}"></label>
<label>واتساب الظاهر للناس<input class="field" name="contact_whatsapp" type="tel" value="${safe(v.contact_whatsapp||'')}"></label>
<label>حالة الإعلان<select class="field" name="status"><option value="pending" ${v.status==='active'?'':'selected'}>قيد المراجعة (غير منشور)</option><option value="active" ${v.status==='active'?'selected':''}>منشور للجمهور</option><option value="hidden" ${v.status==='hidden'?'selected':''}>مخفي</option><option value="sold" ${v.status==='sold'?'selected':''}>تم البيع</option></select></label>
<label>صور جديدة (حتى 20، كل صورة 10 ميجا)<input class="field" name="photos" type="file" multiple accept="image/jpeg,image/png,image/webp,image/avif"></label>
<label class="wide">الوصف<textarea name="description" class="field" rows="4">${safe(v.description||'')}</textarea></label>
<label><input name="negotiable" type="checkbox" ${v.negotiable!==false?'checked':''}> السعر قابل للتفاوض</label>
<label><input name="accepts_exchange" type="checkbox" ${v.accepts_exchange?'checked':''}> يقبل البدل</label>
<p class="wide hint" id="adProgress">احفظ المركبة وستُرفع الصور تباعًا. لا تغلق الصفحة أثناء الرفع.</p>
<button type="submit" id="adSubmit" class="btn green wide">${v.id?'حفظ التعديل':'نشر أو حفظ المركبة'}</button></form>`;}
async function modelsForAd(brand,selected){const box=$('adModel');if(!box)return;box.innerHTML='<option value="">غير محدد</option>';if(!brand)return;const {data,error:e}=await db.from('cm_models').select('id,name_ar,name_en').eq('brand_id',Number(brand)).order('name_en');if(e)throw e;box.innerHTML+=(data||[]).map(x=>`<option value="${x.id}" ${String(x.id)===String(selected)?'selected':''}>${safe(x.name_ar||x.name_en)}</option>`).join('');}
async function newListing(){await adLookups();$('content').innerHTML=`<div class="panel"><h2>إضافة مركبة جديدة</h2><p class="hint">هذه الوظيفة متاحة للأدمن فقط. رقم التواصل الذي تكتبه هنا يظهر للزوار.</p>${adForm()}</div>`;attachForm();}
async function editListing(id){await adLookups();const [r,photos]=await Promise.all([db.from('cm_listings').select('*').eq('id',id).single(),db.from('cm_listing_images').select('id,storage_path,sort_order').eq('listing_id',id).order('sort_order')]);if(r.error||photos.error)throw(r.error||photos.error);const gallery=(photos.data||[]).map(pic=>{const src=db.storage.from('cm-vehicles').getPublicUrl(pic.storage_path).data.publicUrl;return `<div style="width:114px"><img src="${safe(src)}" alt="صورة إعلان" style="width:110px;height:85px;object-fit:cover;border-radius:9px"><button class="btn warn small" data-photo-remove="${pic.id}" data-photo-listing="${id}">حذف الصورة</button></div>`;}).join('');modal('تعديل إعلان',`<div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px">${gallery||'<p class="hint">لا توجد صور بعد</p>'}</div>`+adForm(r.data));await attachForm(r.data);}
async function deletePhoto(id,listingId){if(!confirm('حذف الصورة نهائيًا من الإعلان والتخزين؟'))return;const {data,error:e}=await db.from('cm_listing_images').select('storage_path').eq('id',id).single();if(e)throw e;const r=await db.storage.from('cm-vehicles').remove([data.storage_path]);if(r.error)throw r.error;const del=await db.from('cm_listing_images').delete().eq('id',id);if(del.error)throw del.error;notice('تم حذف الصورة');await editListing(listingId);}
async function attachForm(prev={}){const form=$('adForm'),button=$('adSubmit');$('adBrand').onchange=()=>modelsForAd($('adBrand').value).catch(error);if(prev.brand_id)await modelsForAd(prev.brand_id,prev.model_id);form.onsubmit=async e=>{e.preventDefault();button.disabled=true;try{
const v=Object.fromEntries(new FormData(form).entries());const files=Array.from(form.elements.photos.files||[]);if(files.length>20)throw Error('لا يمكن رفع أكثر من 20 صورة');const allowed={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/avif':'avif'};if(files.some(f=>!allowed[f.type]||f.size>10*1024*1024))throw Error('الصورة يجب أن تكون JPG/PNG/WEBP/AVIF وأقل من 10 ميجا');const num=x=>x===''?null:Number(x);
const record={title:v.title.trim(),description:v.description.trim()||null,category_id:Number(v.category_id),brand_id:num(v.brand_id),model_id:num(v.model_id),model_custom:v.model_custom.trim()||null,price:Number(v.price),manufacture_year:num(v.manufacture_year),mileage_km:num(v.mileage_km),color:v.color.trim()||null,vehicle_condition:v.vehicle_condition,fuel_type:v.fuel_type||null,transmission:v.transmission||null,governorate_id:Number(v.governorate_id),city:v.city.trim(),contact_phone:v.contact_phone.trim()||null,contact_whatsapp:v.contact_whatsapp.trim()||null,negotiable:form.elements.negotiable.checked,accepts_exchange:form.elements.accepts_exchange.checked,status:v.status};if(v.status==='active')record.published_at=new Date().toISOString();
let id=prev.id;
if(!id){record.seller_id=user.id;const r=await db.from('cm_listings').insert(record).select('id').single();if(r.error)throw r.error;id=r.data.id;}else{const r=await db.from('cm_listings').update(record).eq('id',id);if(r.error)throw r.error;}
let occupied=[];if(files.length){const r=await db.from('cm_listing_images').select('sort_order').eq('listing_id',id);if(r.error)throw r.error;occupied=(r.data||[]).map(x=>x.sort_order);if(occupied.length+files.length>20)throw Error('تم حفظ المركبة ولكن مجموع صوره سيتجاوز 20 صورة');}
for(let i=0;i<files.length;i++){const f=files[i],slot=Array.from({length:20},(_,i)=>i+1).find(x=>!occupied.includes(x));occupied.push(slot);$('adProgress').textContent=`رفع ${i+1} من ${files.length}...`;const path=`${user.id}/${id}/${crypto.randomUUID()}.${allowed[f.type]}`;const r=await db.storage.from('cm-vehicles').upload(path,f,{contentType:f.type,upsert:false});if(r.error)throw Error('تم حفظ المركبة، لكن فشل رفع صورة: '+r.error.message);const meta=await db.from('cm_listing_images').insert({listing_id:id,storage_path:path,sort_order:slot,is_cover:occupied.length===1});if(meta.error)throw Error('تم رفع صورة ولكن فشل تسجيلها: '+meta.error.message);}
notice('تم حفظ المركبة'+(files.length?' والصور':''));dismiss();active='listings';currentStatus='all';page=0;query='';await render();
}catch(ex){error(ex);$('adProgress').textContent='تنبيه: '+(ex.message||ex);}finally{button.disabled=false;}};}
async function deleteListing(id){if(!confirm('حذف هذا الإعلان نهائيًا من قاعدة البيانات؟'))return;const {error:e}=await db.from('cm_listings').delete().eq('id',id);if(e)throw e;notice('تم حذف الإعلان. ملفات الصور قد تحتاج حذفًا مستقلًا من Storage.');render();}

async function listings(){let q=db.from('cm_listings').select('id,title,price,status,created_at,featured_until,cm_listing_images(storage_path,is_cover,sort_order),cm_governorates(name_ar)',{count:'exact'}).order('created_at',{ascending:false});const sel=currentStatus;if(sel!=='all')q=q.eq('status',sel);if(query)q=q.ilike('title',`%${query.replace(/[%_,]/g,' ')}%`);const {data,error:e,count}=await q.range(page*20,page*20+19);if(e)throw e;lastCount=data.length;
 const rows=(data||[]).map(x=>{const cover=x.cm_listing_images?.find(i=>i.is_cover)||x.cm_listing_images?.[0];const src=cover?db.storage.from('cm-vehicles').getPublicUrl(cover.storage_path).data.publicUrl:'';return `<tr><td>${src?`<img class="preview" src="${safe(src)}" loading="lazy" alt="">`:'🚗'}</td><td><strong>${safe(x.title)}</strong><br><span class="hint">${safe(x.cm_governorates?.name_ar||'')} · ${dt(x.created_at)}</span></td><td>${money(x.price)}</td><td>${badge(x.status)}</td><td>${x.featured_until && new Date(x.featured_until)>new Date()?'⭐ مميز':'—'}</td><td><div class="rowactions">${b('تفاصيل',`data-listing="${x.id}"`)}${b('تعديل',`data-edit="${x.id}"`)}${b('حذف',`data-delete-listing="${x.id}"`,'warn')}${x.status!=='active'?b('قبول',`data-listing-status="${x.id}" data-next="active"`,'green'):''}${x.status!=='rejected'?b('رفض',`data-listing-status="${x.id}" data-next="rejected"`,'warn'):''}${b('إخفاء',`data-listing-status="${x.id}" data-next="hidden"`)}${b('تمييز أسبوع',`data-feature="${x.id}"`,'gray')}</div></td></tr>`;}).join('');
 $('content').innerHTML=`<div class="panel">${toolbar('إدارة المركبات',`<select class="field" id="statusFilter"><option value="pending">بانتظار المراجعة</option><option value="all">كل المركبات</option><option value="active">منشور</option><option value="rejected">مرفوض</option><option value="hidden">مخفي</option><option value="sold">تم البيع</option></select><input class="field" id="searchListings" placeholder="بحث باسم الإعلان" value="${safe(query)}">${b('بحث','data-apply-search="1"','green')}`)}${table(['صورة','المركبة','السعر','الحالة','التمييز','الإجراءات'],rows)}${pagination()}<p class="hint">${count??0} نتيجة متاحة · تُعرض 20 نتيجة في الصفحة.</p></div>`;

}
async function users(){let q=db.from('cm_profiles').select('id,username,display_name,account_type,created_at',{count:'exact'}).order('created_at',{ascending:false});if(query)q=q.ilike('display_name',`%${query.replace(/[%_,]/g,' ')}%`);const {data,error:e,count}=await q.range(page*20,page*20+19);if(e)throw e;lastCount=data.length;const ids=data.map(x=>x.id);let flags=[];if(ids.length){const r=await db.from('cm_account_flags').select('user_id,is_blocked,is_verified').in('user_id',ids);if(r.error)throw r.error;flags=r.data||[];}const byId=new Map(flags.map(x=>[x.user_id,x]));
 const rows=data.map(x=>{const f=byId.get(x.id)||{};return `<tr><td><strong>${safe(x.display_name)}</strong><br><span class="hint">@${safe(x.username)}</span></td><td>${x.account_type==='seller'?'بائع':'مشتري'}</td><td>${f.is_blocked?badge('محظور'):badge('active')}</td><td>${f.is_verified?'موثق':'غير موثق'}</td><td>${dt(x.created_at)}</td><td><div class="rowactions">${b(f.is_blocked?'رفع الحظر':'حظر',`data-block="${x.id}" data-blocked="${f.is_blocked?'1':'0'}"`,f.is_blocked?'green':'warn')}${b(f.is_verified?'إلغاء التوثيق':'توثيق',`data-verify="${x.id}" data-verified="${f.is_verified?'1':'0'}"`)}</div></td></tr>`;}).join('');
 $('content').innerHTML=`<div class="panel">${toolbar('الحسابات',`<input class="field" id="searchUsers" value="${safe(query)}" placeholder="ابحث باسم المستخدم">${b('بحث','data-apply-search="1"','green')}`)}${table(['المستخدم','النوع','الحالة','التوثيق','تاريخ الانضمام','الإجراءات'],rows)}${pagination()}<p class="hint">${count??0} حساب · الحظر هنا يتحكم في عمليات محددة حسب سياسات RLS الحالية.</p></div>`;
}
async function catalog(){const [cats,bs,ms]=await Promise.all([db.from('cm_categories').select('id,slug,name_ar,is_active,sort_order').order('sort_order'),db.from('cm_brands').select('id,slug,name_ar,name_en,is_active').order('name_ar').limit(200),db.from('cm_models').select('id,brand_id,name_en,name_ar,is_active').order('id',{ascending:false}).limit(70)]);if(cats.error||bs.error||ms.error)throw (cats.error||bs.error||ms.error);brands=bs.data||[];
 const crows=(cats.data||[]).map(x=>`<tr><td>${safe(x.name_ar)}</td><td>${safe(x.slug)}</td><td>${badge(x.is_active?'active':'hidden')}</td><td>${b(x.is_active?'تعطيل':'تفعيل',`data-toggle="cm_categories" data-id="${x.id}" data-active="${x.is_active?'1':'0'}"`)}</td></tr>`).join('');

 const mrows=(ms.data||[]).map(x=>`<tr><td>${safe(x.name_ar||x.name_en)}</td><td>${safe(brands.find(b=>b.id===x.brand_id)?.name_ar||'')}</td><td>${b(x.is_active?'تعطيل':'تفعيل',`data-toggle="cm_models" data-id="${x.id}" data-active="${x.is_active?'1':'0'}"`)}</td></tr>`).join('');
 $('content').innerHTML=`<div class="panel">${toolbar('الأقسام',b('＋ إضافة قسم','data-add="cm_categories"','green'))}${table(['القسم','الرمز','الحالة','الإجراءات'],crows)}</div><div class="panel">${toolbar('ماركات المركبات',b('＋ إضافة ماركة','data-add="cm_brands"','green'))}${table(['الاسم العربي','الاسم الإنجليزي','الحالة','الإجراءات'],brows)}</div><div class="panel">${toolbar('الموديلات',b('＋ إضافة موديل','data-add="cm_models"','green'))}${table(['الموديل','الماركة','الإجراءات'],mrows)}<p class="hint">معروض أحدث 70 موديل؛ وباقي الموديلات محفوظة داخل قاعدة البيانات.</p></div>`;
}
async function reports(){const {data,error:e}=await db.from('cm_reports').select('id,reason,details,status,created_at,listing_id,reported_user_id').order('created_at',{ascending:false}).limit(100);if(e)throw e;const rows=(data||[]).map(x=>`<tr><td>${safe(x.reason)}<br><span class="hint">${safe(x.details||'')}</span></td><td>${x.listing_id?'إعلان':'حساب'}</td><td>${badge(x.status)}</td><td>${dt(x.created_at)}</td><td>${x.status!=='resolved'?b('تمت المراجعة',`data-resolve="${x.id}"`,'green'):''}${x.listing_id?b('عرض الإعلان',`data-listing="${x.listing_id}"`):''}</td></tr>`).join('');$('content').innerHTML=`<div class="panel">${toolbar('بلاغات المستخدمين')}${table(['البلاغ','النوع','الحالة','التاريخ','الإجراء'],rows)}</div>`;}
async function support(){const {data,error:e}=await db.from('cm_support_tickets').select('id,subject,message,status,admin_reply,created_at').order('created_at',{ascending:false}).limit(100);if(e)throw e;const rows=(data||[]).map(x=>`<tr><td><strong>${safe(x.subject)}</strong><br><span class="hint">${safe(x.message)}</span></td><td>${badge(x.status)}</td><td>${safe(x.admin_reply||'—')}</td><td>${dt(x.created_at)}</td><td>${b('رد وتحديث',`data-reply="${x.id}"`,'green')}</td></tr>`).join('');$('content').innerHTML=`<div class="panel">${toolbar('طلبات المساعدة')}${table(['الموضوع','الحالة','رد الإدارة','التاريخ','الإجراء'],rows)}</div>`;}
async function banners(){const {data,error:e}=await db.from('cm_banners').select('*').order('sort_order').limit(70);if(e)throw e;const rows=(data||[]).map(x=>`<tr><td>${safe(x.title)}</td><td>${x.image_url?`<a href="${safe(x.image_url)}" target="_blank" rel="noopener">معاينة الصورة</a>`:'—'}</td><td>${badge(x.is_active?'active':'hidden')}</td><td>${b(x.is_active?'إيقاف':'تفعيل',`data-banner-toggle="${x.id}" data-active="${x.is_active?'1':'0'}"`)} ${b('حذف',`data-banner-delete="${x.id}"`,'warn')}</td></tr>`).join('');$('content').innerHTML=`<div class="panel">${toolbar('بنرات الموقع',b('＋ بنر جديد','data-banner-add="1"','green'))}${table(['عنوان','الصورة','الحالة','إجراءات'],rows)}<p class="hint">يمكن إدارة البنرات من هنا. لعرضها في الصفحة الرئيسية يلزم قسم بنرات في واجهة الموقع.</p></div>`;}
async function settings(){const {data,error:e}=await db.from('cm_settings').select('key,value,is_public').order('key');if(e)throw e;const rows=(data||[]).map(x=>`<tr><td><strong>${safe(x.key)}</strong></td><td><code style="white-space:pre-wrap">${safe(JSON.stringify(x.value))}</code></td><td>${x.is_public?'عام':'خاص'}</td><td>${b('تعديل',`data-setting="${safe(x.key)}"`,'gray')}</td></tr>`).join('');$('content').innerHTML=`<div class="panel">${toolbar('إعدادات المنصة')}${table(['المفتاح','القيمة','الظهور','إجراء'],rows)}<p class="danger-note">هذه القيم إعدادات محفوظة في قاعدة البيانات؛ بعض الخيارات لن تغيّر سلوك الموقع حتى تتم برمجتها داخل الواجهة والخادم.</p></div>`;}
async function openTab(name='home'){if(!user)return;active=name;query='';page=0;return render();}
async function render(){document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===active));$('pageTitle').textContent=({home:'نظرة عامة',new:'إنشاء إعلان',listings:'إدارة المركبات',users:'إدارة المستخدمين',catalog:'الأقسام والماركات والموديلات',reports:'البلاغات',support:'طلبات المساعدة',banners:'البنرات',settings:'إعدادات الموقع'})[active]||'الإدارة';$('content').innerHTML='<div class="panel">جارٍ تحميل البيانات...</div>';try{await ({home,newListing,listings,users,catalog,reports,support,banners,settings}[active]||home)();}catch(e){error(e);$('content').innerHTML='<div class="panel error">تعذّر جلب البيانات: '+safe(e?.message||'خطأ')+'</div>';}}
async function fullListing(id){const {data,error:e}=await db.from('cm_listings').select('*,cm_listing_images(storage_path,is_cover,sort_order),cm_profiles(username,display_name),cm_brands(name_ar),cm_categories(name_ar)').eq('id',id).maybeSingle();if(e)throw e;if(!data)return notice('الإعلان غير متاح');const images=(data.cm_listing_images||[]).map(i=>`<img style="height:130px;width:170px;object-fit:cover;border-radius:10px" src="${safe(db.storage.from('cm-vehicles').getPublicUrl(i.storage_path).data.publicUrl)}" alt="">`).join('');modal('تفاصيل المركبة',`<div style="display:flex;gap:7px;flex-wrap:wrap">${images||'لم تُرفع صور'}</div><h3>${safe(data.title)}</h3><p><b>${money(data.price)}</b> · ${badge(data.status)}</p><p class="hint">${safe(data.description||'بدون وصف')}</p><p class="hint">${safe(data.cm_categories?.name_ar||'')} · ${safe(data.cm_brands?.name_ar||data.brand_custom||'')} · الناشر: ${safe(data.cm_profiles?.display_name||'—')}</p><div class="actionbar">${b('قبول',`data-listing-status="${id}" data-next="active"`,'green')}${b('رفض',`data-listing-status="${id}" data-next="rejected"`,'warn')}${b('إخفاء',`data-listing-status="${id}" data-next="hidden"`)}</div>`);}
function addCatalog(kind){if(kind==='cm_models'){modal('إضافة موديل',`<form id="addCatalogForm" class="form-grid"><input type="hidden" name="kind" value="cm_models"><label>الماركة<select class="field" name="brand_id" required>${brands.map(x=>`<option value="${x.id}">${safe(x.name_ar)}</option>`).join('')}</select></label><label>اسم الموديل بالإنجليزي<input class="field" name="name_en" required></label><label>اسم الموديل بالعربي<input class="field" name="name_ar"></label><button class="btn green wide" type="submit">إضافة الموديل</button></form>`);}else{modal(kind==='cm_categories'?'إضافة قسم':'إضافة ماركة',`<form id="addCatalogForm" class="form-grid"><input type="hidden" name="kind" value="${kind}"><label>الاسم بالعربية<input class="field" name="name_ar" required maxlength="100"></label><label>الاسم بالإنجليزية<input class="field" name="name_en" required maxlength="100"></label><label class="wide">رمز فريد بالإنجليزي<input class="field" name="slug" pattern="[a-z0-9_]+" placeholder="example_brand" required></label><button class="btn green wide" type="submit">حفظ الإضافة</button></form>`);}const form=$('addCatalogForm');form.onsubmit=async e=>{e.preventDefault();const f=valForm(form),kind=f.kind,record=kind==='cm_models'?{brand_id:Number(f.brand_id),name_en:f.name_en.trim(),name_ar:f.name_ar.trim()||null}:{slug:f.slug.trim().toLowerCase(),name_ar:f.name_ar.trim(),name_en:f.name_en.trim()};try{const {error:e}=await db.from(kind).insert(record);if(e)throw e;dismiss();notice('تمت الإضافة');await render();}catch(e){error(e);}};}
function addBanner(){modal('إضافة بنر',`<form id="bannerForm" class="form-grid"><label>عنوان البنر<input class="field" name="title" required></label><label>رابط صورة البنر<input class="field" name="image_url" type="url"></label><label>الرابط عند الضغط<input class="field" name="target_url" type="url"></label><label>الترتيب<input class="field" name="sort_order" type="number" value="0"></label><button class="btn green wide">إضافة البنر</button></form>`);$('bannerForm').onsubmit=async e=>{e.preventDefault();const f=valForm(e.target);try{const {error:e}=await db.from('cm_banners').insert({title:f.title,image_url:f.image_url||null,target_url:f.target_url||null,sort_order:Number(f.sort_order)||0,is_active:true});if(e)throw e;dismiss();notice('تم إضافة البنر');render();}catch(e){error(e);}};}
async function clickAction(e){const el=e.target.closest('button[data-tab],button[data-page],button[data-listing],button[data-listing-status],button[data-edit],button[data-delete-listing],button[data-photo-remove],button[data-feature],button[data-block],button[data-verify],button[data-toggle],button[data-resolve],button[data-reply],button[data-setting],button[data-banner-add],button[data-banner-toggle],button[data-banner-delete],button[data-add],button[data-apply-search]');if(!el)return;const d=el.dataset;try{
 if(d.tab)return openTab(d.tab);
 if(d.page){page=Math.max(0,page+(d.page==='next'?1:-1));return render();}
 if('applySearch' in d){const v=$('searchListings')||$('searchUsers');query=(v?.value||'').trim().slice(0,80);page=0;return render();}
 if(d.listing)return fullListing(d.listing);
 if(d.edit)return editListing(d.edit);
 if(d.photoRemove)return deletePhoto(d.photoRemove,d.photoListing);
 if(d.deleteListing)return deleteListing(d.deleteListing);
 if(d.listingStatus){let reason=null;if(d.next==='rejected'){reason=prompt('سبب رفض الإعلان (سيظهر لصاحب الإعلان):','بيانات الإعلان غير مكتملة');if(reason===null)return;}if(!confirm('هل تؤكد تغيير حالة الإعلان؟'))return;const record={status:d.next,rejection_reason:d.next==='rejected'?reason:null};const {error:e}=await db.from('cm_listings').update(record).eq('id',d.listingStatus);if(e)throw e;notice('تم تحديث حالة الإعلان');dismiss();return render();}
 if(d.feature){if(!confirm('تمييز الإعلان لمدة سبعة أيام؟'))return;const date=new Date(Date.now()+7*86400000).toISOString();const {error:e}=await db.from('cm_listings').update({featured_until:date}).eq('id',d.feature);if(e)throw e;notice('تم تمييز الإعلان');return render();}
 if(d.block){if(d.block===user.id)return notice('لا يمكنك حظر حسابك الإداري');if(!confirm(d.blocked==='1'?'رفع الحظر عن الحساب؟':'حظر هذا المستخدم؟'))return;const {error:e}=await db.from('cm_account_flags').upsert({user_id:d.block,is_blocked:d.blocked!=='1',block_reason:d.blocked==='1'?null:'مخالفة سياسة المنصة'});if(e)throw e;notice('تم تحديث المستخدم');return render();}
 if(d.verify){const {error:e}=await db.from('cm_account_flags').upsert({user_id:d.verify,is_verified:d.verified!=='1'});if(e)throw e;notice('تم تحديث التوثيق');return render();}
 if(d.toggle){const {error:e}=await db.from(d.toggle).update({is_active:d.active!=='1'}).eq('id',Number(d.id));if(e)throw e;notice('تم تحديث العنصر');return render();}
 if(d.add)return addCatalog(d.add);
 if(d.resolve){const {error:e}=await db.from('cm_reports').update({status:'resolved',resolved_at:new Date().toISOString()}).eq('id',d.resolve);if(e)throw e;notice('تم إغلاق البلاغ');return render();}
 if(d.reply){const response=prompt('اكتب رد الإدارة (لا تتركه فارغًا):');if(response===null)return;if(!response.trim())return notice('الرد فارغ');const {error:e}=await db.from('cm_support_tickets').update({admin_reply:response.trim(),status:'resolved'}).eq('id',d.reply);if(e)throw e;notice('تم حفظ الرد');return render();}
 if(d.setting){const {data,error:e}=await db.from('cm_settings').select('value').eq('key',d.setting).single();if(e)throw e;const input=prompt('القيمة بصيغة JSON (مثال true أو "نص"):',JSON.stringify(data.value));if(input===null)return;let value;try{value=JSON.parse(input);}catch{return notice('تنسيق JSON غير صحيح');}const r=await db.from('cm_settings').update({value}).eq('key',d.setting);if(r.error)throw r.error;notice('تم تحديث الإعداد');return render();}
 if('bannerAdd' in d)return addBanner();
 if(d.bannerToggle){const {error:e}=await db.from('cm_banners').update({is_active:d.active!=='1'}).eq('id',d.bannerToggle);if(e)throw e;notice('تم تحديث البنر');return render();}
 if(d.bannerDelete){if(!confirm('حذف البنر نهائيًا؟'))return;const {error:e}=await db.from('cm_banners').delete().eq('id',d.bannerDelete);if(e)throw e;notice('تم حذف البنر');return render();}
 }catch(ex){error(ex);}}
document.addEventListener('click',clickAction);
// Keep current table filters when selecting an option
document.addEventListener('change',e=>{if(e.target.id==='statusFilter'){currentStatus=e.target.value;page=0;query='';render();}});
// load initial authentication
if(!window.supabase){$('loginMessage').textContent='تعذر تحميل مكتبة Supabase. تحقق من الاتصال بالإنترنت.';}else authCheck().catch(error);
})();
</script>
